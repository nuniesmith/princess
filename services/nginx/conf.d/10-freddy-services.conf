# freddy.7gram.xyz — serves the edge dashboard (freddy's own nginx used to
# host it; princess owns the dashboard now)
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name freddy.7gram.xyz;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /dashboard;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# shelfmark.7gram.xyz — audiobook/ebook organiser, request API and web UI.
# Runs on freddy beside audiobookshelf; API published there on 8110.
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name shelfmark.7gram.xyz;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Ebook downloads stream through here; audiobooks are handed off to
    # Audiobookshelf links rather than proxied.
    client_max_body_size 1G;

    location / {
        set $upstream_shelfmark $freddy_shelfmark_upstream;
        proxy_pass http://$upstream_shelfmark;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A Prowlarr search fans out to every indexer and is routinely slower
        # than the 60s default; the job views are long-lived too.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Range requests for large ebook downloads must pass through intact.
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Health endpoint, for Uptime Kuma. Unauthenticated by design and it
    # returns no data about the library.
    location = /healthz {
        set $upstream_shelfmark_health $freddy_shelfmark_upstream;
        proxy_pass http://$upstream_shelfmark_health;
        access_log off;
    }
}

# lifeos.7gram.xyz — personal operating system (SvelteKit + PostgreSQL).
# Runs on freddy, published there on 8140. Its own nginx sits between this and
# the app, and already applies the app-level policy below.
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name lifeos.7gram.xyz;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # HSTS belongs here and only here: this is where TLS is terminated, and
    # the origin speaks plain HTTP over the tailnet.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # X-Frame-Options and X-Content-Type-Options are DELIBERATELY not set here,
    # unlike the vhosts above. LifeOS's own nginx already sends both, and its
    # X-Frame-Options is DENY — stricter than the SAMEORIGIN used elsewhere in
    # this file. add_header appends rather than replaces, so setting them again
    # would put two X-Frame-Options values on every response; a browser reading
    # conflicting values may honour neither, which would turn a stricter policy
    # into no policy at all. The origin also sets Referrer-Policy,
    # Permissions-Policy and X-Robots-Tag, all of which pass through.
    #
    # Adding a header here later means removing it from
    # lifeos:infrastructure/nginx/default.conf in the same change.

    # Matches client_max_body_size in LifeOS's own nginx. A smaller value here
    # would reject an upload the origin was willing to take, at the edge, with
    # an error that says nothing about which proxy refused it.
    client_max_body_size 64m;

    location / {
        set $upstream_lifeos $freddy_lifeos_upstream;
        proxy_pass http://$upstream_lifeos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Load-bearing. SvelteKit compares the request origin against its
        # configured ORIGIN (https://lifeos.7gram.xyz) before accepting a form
        # post; if this says http, every form submission fails CSRF while the
        # pages themselves render perfectly.
        proxy_set_header X-Forwarded-Proto $scheme;

        # No Upgrade/Connection headers, unlike the vhosts above: LifeOS opens
        # no WebSocket and no event stream, and forwarding `Connection:
        # upgrade` on requests that are not upgrades is a keepalive hazard for
        # no benefit.

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Liveness, for Uptime Kuma. Unauthenticated by design — it reports only
    # that the process is answering, never anything about the data.
    location = /api/health/live {
        set $upstream_lifeos_health $freddy_lifeos_upstream;
        proxy_pass http://$upstream_lifeos_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
